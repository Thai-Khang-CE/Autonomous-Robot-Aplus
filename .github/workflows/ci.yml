name: Robot Aplus CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Phase 1: C++ coding convention
  cpp-style:
    name: C++ Style
    uses: ./.github/workflows/_cpp-format.yml

